name: Lead Vault validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/dpf-lead-vault-v1]

permissions:
  contents: read

jobs:
  phone-normalization:
    name: Phone normalization unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free validation tests
        run: npm test

  migration-smoke-test:
    name: PostgreSQL 17 migration and security smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap minimal Supabase auth roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-bootstrap.sql
      - name: Apply Lead Vault migration to disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610300001_dpf_lead_vault.sql
      - name: Verify RLS, grants, tenant isolation and provenance idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-migration-assertions.sql

  production-build:
    name: Vite production build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from the declared dependency set
        run: npm install --package-lock-only --ignore-scripts
      - name: Pin direct dependencies to resolved versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[section] || {})) {
              const resolved = lock.packages[`node_modules/${name}`]?.version;
              if (!resolved) throw new Error(`Missing locked package: ${name}`);
              pkg[section][name] = resolved;
              lock.packages[''][section][name] = resolved;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Install exact locked dependencies
        run: npm ci
      - name: Build all configured application entry points
        run: npm run build
      - name: Commit reproducible dependency manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Pin DPF application dependencies and lockfile"
            git push
          fi
