name: Lead Vault validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/dpf-lead-vault-v1]

concurrency:
  group: dpf-lead-vault-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phone-normalization:
    name: Phone normalization unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked dependencies
        run: npm ci
      - name: Run unit and API guard tests
        run: npm test

  migration-smoke-test:
    name: PostgreSQL 17 migration and security smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap minimal Supabase auth roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-bootstrap.sql
      - name: Apply Lead Vault migration to disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610300001_dpf_lead_vault.sql
      - name: Verify RLS, grants, tenant isolation and provenance idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-migration-assertions.sql
      - name: Apply workspace membership migration to disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610300002_dpf_workspace_membership.sql
      - name: Verify role-based workspace access and suspension
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-membership-assertions.sql
      - name: Apply transactional import functions to disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610300003_dpf_import_approval_commit.sql
      - name: Verify approval, immutability and idempotent commit
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-import-commit-assertions.sql

  production-build:
    name: Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked dependencies
        run: npm ci
      - name: Build all configured application entry points
        run: npm run build
